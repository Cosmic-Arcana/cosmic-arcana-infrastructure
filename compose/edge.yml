# One front door for the application: nginx in front of every service, configured in ../nginx.
#
#   docker compose -f compose/application.yml -f compose/edge.yml up -d --wait
#
#   :8080   public. The storefront, plus the tarot live socket at /live.
#   :8081   loopback only. Every backend by name, for an operator:
#             curl -H 'Host: tarot.localhost' http://127.0.0.1:8081/health/ready
#
# The storefront is not defined in application.yml; this expects a compose file that does, under the
# service name cosmic-arcana-storefront (e2e-ci.yml uses the same name). Without it :8080 answers 502.
# The browser's socket address is baked into the storefront image at build time, so build it with
# NEXT_PUBLIC_TAROT_WS_URL=ws://<host>:8080/live.
#
# Backends lose their published ports on purpose: reaching them around the edge defeats it. Do not
# layer this over the validation runs, which call the services on those ports.
services:
  edge:
    image: nginx:1.30.6-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
    ports: ['8080:8080', '127.0.0.1:8081:8081']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/_edge/health']
      interval: 3s
      timeout: 3s
      retries: 10

  tarot-service-api:
    ports: !reset []
  history-service-api:
    ports: !reset []
  ai-service-api:
    ports: !reset []
  nasa-service-api:
    ports: !reset []
  mcp-service-api:
    ports: !reset []
