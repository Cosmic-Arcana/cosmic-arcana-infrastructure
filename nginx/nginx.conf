worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  server_tokens off;

  # Docker's embedded DNS. Every upstream is a variable, so a name is looked up per request rather
  # than at start-up: the tier-2 services sit behind a compose profile and may not exist, and nginx
  # would otherwise refuse to start over a host it cannot resolve.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $status $log_level {
    ~^5     error;
    ~^4     warn;
    default log;
  }

  # $request_time is seconds with three decimals; the log line wants whole milliseconds as a number,
  # so leading zeros have to go.
  map $request_time $duration_ms {
    ~^(?<s>[1-9]\d*)\.(?<ms>\d\d\d)$  $s$ms;
    ~^0\.00(?<ms>\d)$                 $ms;
    ~^0\.0(?<ms>\d\d)$                $ms;
    ~^0\.(?<ms>[1-9]\d\d)$            $ms;
    default                           0;
  }

  # One JSON object per line with the fields every service logs. The path is $uri, never the query
  # string, and no request header or body is written. The correlation id is the one the BFF put on
  # its response; the edge never invents one.
  log_format json escape=json
    '{"timestamp":"$time_iso8601","level":"$log_level","service":"edge","correlationId":"$upstream_http_x_correlation_id",'
    '"context":"nginx","message":"request handled","method":"$request_method","route":"$uri",'
    '"statusCode":$status,"durationMs":$duration_ms}';
  access_log /dev/stdout json;

  include /etc/nginx/conf.d/*.conf;
}
