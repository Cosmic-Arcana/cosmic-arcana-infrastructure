# Operator access to nasa-service-api through nasa.localhost on the loopback-only listener. Not for browsers.
server {
  listen 8081;
  server_name nasa.localhost;

  location / {
    set $upstream http://nasa-service-api:3002;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass $upstream;
  }
}
