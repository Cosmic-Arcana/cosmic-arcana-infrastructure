# Operator access to history-service-api through history.localhost on the loopback-only listener. Not for browsers.
server {
  listen 8081;
  server_name history.localhost;

  location / {
    set $upstream http://history-service-api:3005;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass $upstream;
  }
}
