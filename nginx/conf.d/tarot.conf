# Operator access to tarot-service-api through tarot.localhost on the loopback-only listener. Not for browsers.
server {
  listen 8081;
  server_name tarot.localhost;

  location / {
    set $upstream http://tarot-service-api:3004;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass $upstream;
  }
}
