# Operator access to ai-service-api through ai.localhost on the loopback-only listener. Not for browsers.
server {
  listen 8081;
  server_name ai.localhost;

  location / {
    set $upstream http://ai-service-api:3001;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Predictions are meant to stream; buffering would hold the tokens back.
    proxy_buffering off;
    proxy_pass $upstream;
  }
}
