# Operator access to mcp-service-api through mcp.localhost on the loopback-only listener. Not for browsers.
server {
  listen 8081;
  server_name mcp.localhost;

  location / {
    set $upstream http://mcp-service-api:3003;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # MCP answers over long-lived event streams; buffering would hold events back.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass $upstream;
  }
}
