# The only listener meant for the outside. The storefront is the BFF, so it is the whole public
# surface; the one backend a browser reaches directly is the live socket of tarot-service-api.
server {
  listen 8080 default_server;
  server_name _;

  client_max_body_size 64k;

  location = /_edge/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /live {
    set $upstream http://tarot-service-api:3004;
    include /etc/nginx/snippets/proxy.conf;
    # The edge is the outermost hop, so what a client claims in X-Forwarded-For is discarded: kept,
    # it would let anyone pick their own bucket in the BFF's rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    # An idle socket would otherwise be cut after nginx's default 60 seconds.
    proxy_read_timeout 1h;
    proxy_pass $upstream;
  }

  location / {
    set $upstream http://cosmic-arcana-storefront:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_pass $upstream;
  }
}
